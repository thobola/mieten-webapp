// NK-Monatswert berechnen (turnus = “monatlich” | “jaehrlich”)
function nkMonat(val, turnus) {
const v = parseFloat(val) || 0;
return turnus === “jaehrlich” ? v / 12 : v;
}

// Gesamt-NK/Monat für ein Objekt
function effNKMonat(p) {
if (p.isWG) return p.wgZimmer.reduce((s, z) => {
const nk = z.nebenkosten || {};
return s + nkMonat(nk.hausgeld, nk.hausgeldTurnus)
+ nkMonat(nk.strom, nk.stromTurnus)
+ nkMonat(nk.internet, nk.internetTurnus)
+ nkMonat(nk.grundsteuer, nk.grundsteuerTurnus);
}, 0);
const nk = p.nebenkosten || {};
return nkMonat(nk.hausgeld, nk.hausgeldTurnus)
+ nkMonat(nk.strom, nk.stromTurnus)
+ nkMonat(nk.internet, nk.internetTurnus)
+ nkMonat(nk.grundsteuer, nk.grundsteuerTurnus);
}

function effRent(p) {
const parking = (p.parkplatz?.aktiv && p.status===“vermietet”) ? (parseFloat(p.parkplatz?.miete)||0) : 0;
if (p.isWG) return p.wgZimmer.filter(z=>z.status===“vermietet”).reduce((s,z)=>s+(parseFloat(z.rent)||0),0) + parking;
return (p.status===“vermietet” ? (parseFloat(p.rent)||0) : 0) + parking;
}
function parkingRent(p) {
return (p.parkplatz?.aktiv && p.status===“vermietet”) ? (parseFloat(p.parkplatz?.miete)||0) : 0;
}

function calcFin(f, rent) {
const dar = Math.max(0,(f.kaufpreis||0)-(f.eigenkapital||0));
const zins = dar*((f.zinssatz||0)/100)/12;
const tilg = dar*((f.tilgung||0)/100)/12;
const kd = zins+tilg;
const nuk = (f.hausgeldNichtUmlegbar||0);
const cf = rent-kd-nuk;
const brutto = f.kaufpreis ? rent*12/f.kaufpreis*100 : 0;
const ekr = f.eigenkapital ? cf*12/f.eigenkapital*100 : 0;
return {dar,zins,tilg,kd,nuk,cf,brutto,ekr};
}

function fmt(v,sign=false){ const r=Math.round(v); return (sign&&r>0?”+”:””)+r.toLocaleString(“de-DE”)+” €”; }

const STORAGE_KEY = “borgmann_props_v1”;
function loadProps() {
try { const s=localStorage.getItem(STORAGE_KEY); if(s) return JSON.parse(s); } catch(e){}
return initProps;
}
function saveProps(data) {
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
}

// ─── APP ──────────────────────────────────────────────────────────────────────
export default function App() {
const [props,setPropsRaw] = useState(loadProps);
const [sel,setSel] = useState(null);

const [showPortfolio,setShowPortfolio] = useState(false);
const [savedFlash,setSavedFlash] = useState(false);

function setProps(updater) {
setPropsRaw(prev => {
const next = typeof updater === “function” ? updater(prev) : updater;
saveProps(next);
setSavedFlash(true);
setTimeout(() => setSavedFlash(false), 1800);
return next;
});
}

const selProp = sel ? props.find(p=>p.id===sel) : null;
const filtered = props.filter(p=>
p.name.toLowerCase().includes(search.toLowerCase())||
p.city.toLowerCase().includes(search.toLowerCase())||
(p.tenant||””).toLowerCase().includes(search.toLowerCase())||
p.wgZimmer.some(z=>(z.tenant||””).toLowerCase().includes(search.toLowerCase()))
);

const totEK      = props.reduce((s,p)=>s+(p.finance?.eigenkapital||0),0);
const totTilg    = props.reduce((s,p)=>{if(!p.finance)return s;const c=calcFin(p.finance,0);return s+c.tilg;},0);

const totKD      = props.reduce((s,p)=>{if(!p.finance)return s;const c=calcFin(p.finance,0);return s+c.kd;},0);

return {…z,payments:pays};
})};
}

return {…p,payments:pays};
}));
}

rent:parseFloat(form.rent)||0,size:parseFloat(form.size)||0,rooms:parseFloat(form.rooms)||0,

}

}

                ["Tilg/Mo",fmt(c.tilg),"#2e7d32"],
                ["Zins/Mo",fmt(c.zins),"#c62828"],
              ].map(([label,val,col])=>(
                <div key={label} style={{textAlign:"center",background:"#f8f8fb",borderRadius:8,padding:"7px 4px"}}>
                  <div style={{fontSize:9,color:"#aaa"}}>{label}</div>
                  <div style={{fontSize:12,fontWeight:800,color:col}}>{val}</div>
                </div>
              ))}
            </div>
            {p.parkplatz?.aktiv&&<div style={{marginTop:6,fontSize:11,color:"#1565c0",background:"#e3f2fd",borderRadius:7,padding:"3px 9px",display:"inline-block"}}>🚗 Parkplatz: {fmt(p.parkplatz.miete)}/Mo</div>}
          </div>
        );
      })}
      <div style={{marginTop:16,borderTop:"1px solid #f0f0f0",paddingTop:14}}>
        <button onClick={()=>{if(window.confirm("Alle Daten zurücksetzen? Dies kann nicht rückgängig gemacht werden.")){localStorage.removeItem("borgmann_props_v1");window.location.reload();}}} style={{width:"100%",padding:"10px",borderRadius:10,border:"1.5px solid #ffd0c8",background:"#fff3f0",color:"#c62828",fontSize:12,fontWeight:700,cursor:"pointer"}}>
          🗑️ Alle Daten zurücksetzen
        </button>
        <div style={{textAlign:"center",fontSize:10,color:"#ccc",marginTop:6}}>Daten werden lokal im Browser gespeichert</div>
      </div>
    </Modal>
  )}
  {showFin&&selProp&&(
    <FinanceModal prop={selProp} onSave={finance=>setProps(ps=>ps.map(p=>p.id===selProp.id?{...p,finance}:p))} onClose={()=>setShowFin(false)}/>
  )}
  {showWG&&selProp?.isWG&&(
    <WGModal prop={selProp} onSave={zimmer=>setProps(ps=>ps.map(p=>p.id===selProp.id?{...p,wgZimmer:zimmer}:p))} onClose={()=>setShowWG(false)}/>
  )}
</div>
